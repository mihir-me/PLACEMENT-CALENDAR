services:
  - type: web
    name: placement-calendar-api
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install && cd ../client && npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
